[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OceanDB"
version = "1.0.0"
description = "Ocean database ingestion and processing library"
readme = "README.md"
requires-python = ">=3.11,<3.15,!=3.13.0,!=3.14.0"

dependencies = [
    "netCDF4~=1.7.1.post1",
    "psycopg~=3.2.1",
    "psycopg-binary~=3.2.1",
    "python-dateutil~=2.9.0.post0",
    "numpy~=2.0.1",
    "pandas~=2.2.2",
    "copernicusmarine>=2.0.0",
    "xarray~=2024.6.0",
    "dotenv",
    "sqlalchemy>2.0",
    "shapely~=2.1.2",
    "pydantic-settings",
    "paramiko>=3.4.0",
    "PyYAML~=6.0",

]

[project.scripts]
oceandb = "OceanDB.cli:cli"

[project.optional-dependencies]
dev = [
    "sphinx~=8.2",
    "sphinx-autodoc-typehints",
    "sphinx-toolbox",
    "sphinx-mdinclude",
    "sphinxawesome-theme",
    "pytest",
    "matplotlib",
    "tcl",
    "black",
    "isort",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["OceanDB*"]

[tool.setuptools.package-data]
"OceanDB.sql" = ["*.sql"]
"OceanDB.sql.tables" = ["*/*.sql", "*.sql"]
"OceanDB.sql.indices" = ["*/*.sql", "*.sql"]
"OceanDB.sql.queries" = ["*/*.sql", "*.sql"]


"OceanDB.data.basin_masks" = ["*.nc"]

"OceanDB.data.basins" = ["*.csv"]

[tool.pytest.ini_options]
markers = [
    "unit: tests that do not require external setup",
    "uses_database: tests that require the active test database",
]
