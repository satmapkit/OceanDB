name: Integration Tests

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      OCEANDB_TEST_POSTGRES_HOST: localhost
      OCEANDB_TEST_POSTGRES_PORT: 5432
      OCEANDB_TEST_POSTGRES_USERNAME: postgres
      OCEANDB_TEST_POSTGRES_PASSWORD: postgres
      OCEANDB_TEST_POSTGRES_DATABASE: ocean
      OCEANDB_TEST_ALONG_TRACK_DATA_DIRECTORY: tests/data/along_track
      OCEANDB_TEST_EDDY_DATA_DIRECTORY: tests/data/eddy
      OCEANDB_TEST_COPERNICUS_USERNAME: none
      OCEANDB_TEST_COPERNICUS_PASSWORD: none
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and test dependencies
        run: |
          pip install -e .
          pip install -r requirements.txt
      - name: Run integration tests
        run: pytest -m uses_database
